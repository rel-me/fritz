[package]
name = "waproto"
version = "0.7.0"
edition = "2024"
rust-version = "1.94"
authors = ["João Lucas <jlucaso@hotmail.com>"]
license = "MIT"
repository = "https://github.com/jlucaso1/whatsapp-rust"
description = "Protocol Buffers definitions for WhatsApp"

# `serde` is referenced only by derives injected into the generated code by
# `build.rs` (`#[derive(serde::Serialize)]`), so static analysers miss it.
[package.metadata.cargo-machete]
ignored = ["serde"]

[package.metadata.fritz]
upstream-revision = "3a08e84e8d7a462f6f87eb98d28fe1ce889a653a"

[features]
default = []
serde-deserialize = []
serde-snake-case = ["serde-deserialize"]
# Enums (de)serialize as their numeric repr instead of the variant name — what
# the JS bridge / camelCase serializer expects.
serde-enum-repr = ["dep:serde_repr"]

[dependencies]
buffa = { version = "0.9.2", default-features = false, features = ["json"] }
bytes = { version = "1.12", default-features = false }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_repr = { version = "0.1", optional = true }

[build-dependencies]
# buffa-build does the codegen; buffa-descriptor decodes+re-encodes the committed
# camelCase descriptor so build.rs can snake_case field names for the Rust API
# (the proto file stays in upstream/whatspec camelCase form); heck does the case
# conversion; sha2 powers the descriptor-freshness guard.
buffa = { version = "0.9.2", default-features = false, features = ["json"] }
buffa-build = { version = "0.9.2", default-features = false }
buffa-descriptor = { version = "0.9.2", default-features = false }
heck = { version = "0.5" }
sha2 = { version = "0.11.0", default-features = false }

[dev-dependencies]
serde_json = { version = "1.0", default-features = false, features = ["std"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }
unused_qualifications = "warn"

[lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "warn"
print_stderr = "warn"
