name: Fritz
options:
  bundleIdPrefix: dev.fritz
  deploymentTarget:
    macOS: "15.0"
packages:
  Fritz:
    path: ..
  Textual:
    url: https://github.com/gonzalezreal/textual
    exactVersion: 0.5.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_STYLE: Manual
targets:
  FritzApp:
    productName: Fritz
    type: application
    platform: macOS
    sources:
      - path: Sources/Fritz
      - path: Resources/AppIcon.icon
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: Fritz
        product: Fritz
      - package: Fritz
        product: FritzUI
      - package: Fritz
        product: FritzUpdates
      - package: Fritz
        product: FritzState
      - package: Textual
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fritz.app
        PRODUCT_NAME: $(FRITZ_PRODUCT_NAME)
        FRITZ_PRODUCT_NAME: Fritz
        PRODUCT_MODULE_NAME: FritzApp
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
        MARKETING_VERSION: 0.1.1
        CURRENT_PROJECT_VERSION: 2
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Fritz
        CFBundleDisplayName: Fritz
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
schemes:
  Fritz:
    build:
      targets:
        FritzApp: all
    run:
      config: Debug
