name: Fritz
options:
  bundleIdPrefix: dev.fritz
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
packages:
  Fritz:
    path: ..
  Textual:
    url: https://github.com/gonzalezreal/textual
    exactVersion: 0.5.0
  Inferno:
    url: https://github.com/twostraws/Inferno
    revision: a40c7a0bdec03aae1bd0b96c41d6a75451bafd2c
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_STYLE: Manual
targets:
  FritzApp:
    productName: Fritz
    type: application
    platform: macOS
    sources:
      - path: Sources/Fritz
      - path: Resources/FritzRaven.icns
        buildPhase: resources
    dependencies:
      - package: Fritz
        product: Bonsplit
      - package: Fritz
        product: Fritz
      - package: Fritz
        product: FritzUI
      - package: Fritz
        product: FritzUpdates
      - package: Fritz
        product: FritzState
      - package: Textual
      - package: Inferno
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fritz.app
        PRODUCT_NAME: $(FRITZ_PRODUCT_NAME)
        FRITZ_PRODUCT_NAME: Fritz
        PRODUCT_MODULE_NAME: FritzApp
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(FRITZ_BROWSER_SWIFT_CONDITIONS)
        SWIFT_OBJC_BRIDGING_HEADER: $(FRITZ_BROWSER_BRIDGING_HEADER)
        LIBRARY_SEARCH_PATHS: $(inherited) $(FRITZ_BROWSER_LIBRARY_PATH)
        OTHER_LDFLAGS: $(inherited) $(FRITZ_BROWSER_LDFLAGS)
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
        MARKETING_VERSION: 0.1.1
        CURRENT_PROJECT_VERSION: 2
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Fritz
        CFBundleDisplayName: Fritz
        CFBundleIconFile: FritzRaven.icns
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
  FritzIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/FritzIOS
      - path: Resources/iOS/Assets.xcassets
      - path: Resources/iOS/PrivacyInfo.xcprivacy
      - path: ../docs/ios-privacy.md
        buildPhase: resources
    preBuildScripts:
      - name: Build Fritz iOS runtime
        path: ../scripts/build-ios-runtime.sh
        basedOnDependencyAnalysis: false
    dependencies:
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - package: Textual
    settings:
      base:
        PRODUCT_MODULE_NAME: FritzIOS
        PRODUCT_BUNDLE_IDENTIFIER: dev.fritz.app
        CODE_SIGN_STYLE: Automatic
        "ARCHS[sdk=iphonesimulator*]": arm64
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/FritzIOS/FritzIOSBridge.h
        OTHER_LDFLAGS: $(inherited) "$(DERIVED_FILE_DIR)/libfritz_ios.a"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fritz
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        MARKETING_VERSION: 0.1.1
        CURRENT_PROJECT_VERSION: 1
  FritzIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/FritzIOSUITests]
    dependencies:
      - target: FritzIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fritz.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        "ARCHS[sdk=iphonesimulator*]": arm64
schemes:
  Fritz-iOS:
    build:
      targets:
        FritzIOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FritzIOSUITests
    archive:
      config: Release
  Fritz:
    build:
      targets:
        FritzApp: all
    run:
      config: Debug
