name: Fritz
options:
  bundleIdPrefix: dev.fritz
  deploymentTarget:
    macOS: "15.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
  Textual:
    url: https://github.com/gonzalezreal/textual
    exactVersion: 0.5.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_STYLE: Manual
targets:
  Fritz:
    type: application
    platform: macOS
    sources:
      - path: Sources/Fritz
        excludes: [LocalModels.json]
      - path: Sources/Fritz/LocalModels.json
        buildPhase: resources
      - path: Resources/AppIcon.icon
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: Sparkle
        product: Sparkle
      - package: Textual
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fritz.app
        PRODUCT_NAME: $(FRITZ_PRODUCT_NAME)
        FRITZ_PRODUCT_NAME: Fritz
        PRODUCT_MODULE_NAME: Fritz
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
        MARKETING_VERSION: 0.1.1
        CURRENT_PROJECT_VERSION: 2
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Fritz
        CFBundleDisplayName: Fritz
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
schemes:
  Fritz:
    build:
      targets:
        Fritz: all
    run:
      config: Debug
