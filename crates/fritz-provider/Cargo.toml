[package]
name = "fritz-provider"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-only"
description = "Shared Fritz provider transport and model discovery"
publish = false

[dependencies]
anyhow = "1"
futures-util = "0.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "query", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_os = "ios")'.dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls"] }

[target.'cfg(not(target_os = "ios"))'.dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
