[package]
name = "fritz-ios"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-only"
description = "In-process Fritz chat runtime for iOS"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
anyhow = "1"
fritz-provider = { path = "../fritz-provider" }
reqwest = { version = "=0.13.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time", "net"] }
