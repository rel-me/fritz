[package]
name = "fritz-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
description = "Host-owned tools and execution policy for Fritz agent harnesses"
publish = false

[features]
rig = ["dep:rig-agent", "dep:rig-core", "dep:futures-util"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros"] }
rig-agent = { version = "=0.42.0", default-features = false, optional = true }
rig-core = { version = "=0.42.0", default-features = false, features = ["reqwest", "rustls"], optional = true }
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
