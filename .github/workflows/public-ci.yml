name: CI

on:
  # PR branches are covered by pull_request; do not run them twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Mac mini tests and Rust checks
    # Check the PR author, not the actor who happens to rerun the workflow.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'gabriel'
    # Assign fritz-isolated-account only to a runner owned by runner-ci.
    # The Keychain wrapper also verifies the account before changing preferences.
    runs-on: [self-hosted, macOS, ARM64, runner-ci, fritz-isolated-account]
    # Includes waiting for the dedicated CI account's session lock.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Build storage lives outside the checkout.
          clean: false
      - name: Clean sources
        run: |
          git reset --hard HEAD
          git clean -ffdx
      - name: Locate local build tools
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
      - name: Select installed Swift 6.3 or newer
        run: |
          python3 - <<'PY'
          import glob, os, re, subprocess
          for xcode in sorted(glob.glob('/Applications/Xcode*.app'), reverse=True):
              developer = xcode + '/Contents/Developer'
              env = dict(os.environ, DEVELOPER_DIR=developer)
              result = subprocess.run(['xcrun', 'swift', '--version'], env=env, capture_output=True, text=True)
              version = re.search(r'Swift version (\d+)\.(\d+)', result.stdout)
              if result.returncode == 0 and version and tuple(map(int, version.groups())) >= (6, 3):
                  with open(os.environ['GITHUB_ENV'], 'a') as output:
                      output.write('DEVELOPER_DIR=' + developer + '\n')
                  print(result.stdout)
                  break
          else:
              raise SystemExit('This project requires an installed Xcode with Swift 6.3 or newer.')
          PY
      - name: Select shared build storage for this toolchain
        run: |
          fingerprint=$( { xcodebuild -version; swift --version; xcrun --sdk macosx --show-sdk-version; rustc -vV; cmake --version; } | shasum -a 256 | cut -d ' ' -f 1)
          # build-cache.py holds the shared lock through builds, tests, and staging.
          # SwiftPM scratch and DerivedData remain isolated by checkout path.
          echo "FRITZ_BUILD_ROOT=$HOME/Builds/Fritz/ci/shared/$fingerprint" >> "$GITHUB_ENV"
      - name: Check toolchains
        run: |
          xcodebuild -version
          swift --version
          cargo --version
          cmake --version
      - name: Test Rust, runtime, libraries, and application
        # Serialize tests within the dedicated CI account's login session.
        run: lockf -k "$HOME/Library/Caches/runner-mac-mini-session.lock" python3 scripts/with-test-keychain.py make -j2 test
      - name: Compare SwiftUI snapshots
        run: lockf -k "$HOME/Library/Caches/runner-mac-mini-session.lock" make check-ui-snapshots
      - name: Upload snapshot failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fritz-ui-snapshot-failures
          path: dist/snapshot-failures
          if-no-files-found: ignore
      - name: Check Rust
        run: make check

  # Preserve the original required-check name and propagate failure/cancellation.
  complete:
    name: Libraries, app, and runtime
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.user.login == 'gabriel')
    needs: macos
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          RESULT: ${{ needs.macos.result }}
        run: test "$RESULT" = success
