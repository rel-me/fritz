name: CI

on:
  # PR branches are covered by pull_request; do not run them twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Model catalog and website
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - name: Require a catalog version increase
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/update-model-catalog.py --check-version "$BASE"
      - run: npm --prefix website test

  macos:
    name: Mac mini tests and Rust checks
    # Check the PR author, not the actor who happens to rerun the workflow.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'gabriel'
    # Assign fritz-isolated-account only to a runner owned by runner-ci.
    # The Keychain wrapper also verifies the account before changing preferences.
    runs-on: [self-hosted, macOS, ARM64, runner-ci, fritz-isolated-account]
    # Includes waiting for the dedicated CI account's session lock.
    timeout-minutes: 300
    steps:
      - name: Locate local build tools
        run: |
          # Keep Cargo's writable registry/git cache independent of ~/.cargo,
          # which may be a stale toolchain-storage symlink on a runner.
          mkdir -p "$HOME/Builds/Machine/Fritz/ci/cargo-home"
          echo "CARGO_HOME=$HOME/Builds/Machine/Fritz/ci/cargo-home" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          # Use Apple Git for checkout and builds without Homebrew's gettext dependency.
          mkdir -p "$RUNNER_TEMP/fritz-ci-bin"
          ln -sf /usr/bin/git "$RUNNER_TEMP/fritz-ci-bin/git"
          echo "$RUNNER_TEMP/fritz-ci-bin" >> "$GITHUB_PATH"
          /usr/bin/git --version
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Build storage lives outside the checkout.
          clean: false
      - name: Clean sources
        run: |
          git reset --hard HEAD
          git clean -ffdx
      - name: Install pinned development tools
        uses: jdx/mise-action@v5.2.7
        with:
          version: 2026.8.8
      - name: Select an installed Xcode with Swift and Metal
        run: |
          python3 - <<'PY'
          import glob, os, re, subprocess, tempfile
          from pathlib import Path

          def run(args, env):
              return subprocess.run(args, env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)

          candidates = []
          for xcode in glob.glob('/Applications/Xcode*.app'):
              developer = xcode + '/Contents/Developer'
              swift = run(['xcrun', 'swift', '--version'], dict(os.environ, DEVELOPER_DIR=developer))
              match = re.search(r'Swift version (\d+)\.(\d+)(?:\.(\d+))?', swift.stdout)
              if swift.returncode == 0 and match:
                  version = tuple(int(part or 0) for part in match.groups())
                  if version >= (6, 3, 0):
                      candidates.append((version, developer, swift.stdout.strip()))
          # Swift 6.3 uses the dependency graph recorded in the committed locks.
          candidates.sort(key=lambda candidate: (candidate[0][:2] != (6, 3), tuple(-part for part in candidate[0])))

          # SwiftPM needs to build a package that processes Metal resources (Inferno).
          # Resolving metal through xcrun also activates Xcode's optional Metal Toolchain.
          with tempfile.TemporaryDirectory(prefix='fritz-xcode-probe-') as probe:
              package = Path(probe)
              target = package / 'Sources' / 'MetalProbe'
              target.mkdir(parents=True)
              (package / 'Package.swift').write_text(
                  '// swift-tools-version: 6.3\n'
                  'import PackageDescription\n'
                  'let package = Package(name: "MetalProbe", targets: ['
                  '.target(name: "MetalProbe", resources: [.process("Probe.metal")])])\n'
              )
              (target / 'Probe.swift').write_text('enum Probe {}\n')
              shader = target / 'Probe.metal'
              shader.write_text(
                  '#include <metal_stdlib>\n'
                  'using namespace metal;\n'
                  'kernel void probe(device uint *value [[buffer(0)]]) { *value += 1; }\n'
              )
              for index, (_, developer, swift) in enumerate(candidates):
                  env = dict(os.environ, DEVELOPER_DIR=developer)
                  sdk = run(['xcrun', '--sdk', 'macosx', '--show-sdk-path'], env)
                  if sdk.returncode:
                      print(f'Skipping {developer}: {sdk.stdout.strip()}')
                      continue
                  metal_version = run(['xcrun', 'metal', '--version'], env)
                  if metal_version.returncode:
                      component = run(['xcodebuild', '-downloadComponent', 'MetalToolchain'], env)
                      if component.returncode:
                          print(f'Skipping {developer}: {component.stdout.strip()}')
                          continue
                  env['SDKROOT'] = sdk.stdout.strip()
                  metal = run(['xcrun', '--sdk', 'macosx', 'metal', '-c', str(shader), '-o', str(package / 'Probe.air')], env)
                  if metal.returncode:
                      print(f'Skipping {developer}: {metal.stdout.strip()}')
                      continue
                  build = run(['swift', 'build', '--build-tests', '--package-path', probe,
                               '--scratch-path', str(package / f'build-{index}')], env)
                  if build.returncode:
                      print(f'Skipping {developer}: the SwiftPM Metal probe failed.\n'
                            + '\n'.join(build.stdout.splitlines()[-12:]))
                      continue
                  with open(os.environ['GITHUB_ENV'], 'a') as output:
                      output.write(f'DEVELOPER_DIR={developer}\nSDKROOT={env["SDKROOT"]}\n')
                  print(f'{developer} with {env["SDKROOT"]}\n{swift}')
                  break
              else:
                  raise SystemExit('Install Xcode with Swift 6.3 or newer and its Metal Toolchain.')
          PY
      - name: Select runner outputs and shared caches for this toolchain
        run: |
          fingerprint=$( { xcodebuild -version; swift --version; xcrun --sdk macosx --show-sdk-version; rustc -vV; cmake --version; } | shasum -a 256 | cut -d ' ' -f 1)
          runner_key=$(printf '%s' "$RUNNER_NAME" | shasum -a 256 | cut -c 1-16)
          # Keep Cargo/CMake outputs, Swift scratch, DerivedData, and their locks
          # runner-local. Retain the existing shared download/compiler caches.
          echo "FRITZ_BUILD_ROOT=$HOME/Builds/Machine/Fritz/ci/runners/$runner_key/$fingerprint" >> "$GITHUB_ENV"
          echo "FRITZ_CACHE_ROOT=$HOME/Builds/Machine/Fritz/ci/shared/$fingerprint" >> "$GITHUB_ENV"
      - name: Check toolchains
        run: |
          xcodebuild -version
          swift --version
          cargo --version
          cmake --version
          python3 --version
          node --version
          xcodegen --version
          gh --version
      - name: Compile tests and check Rust outside the session lock
        run: make -j2 ci-prepare
      - name: Test Rust, runtime, libraries, application, and snapshots
        env:
          FRITZ_SNAPSHOT_MODE: compare
          SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/dist/snapshot-failures
        # Compile first, then serialize only execution in the login session.
        # Take the session lock before the build-cache lock, matching other jobs.
        # Swift scratch state is checkout-specific and protected by that lock.
        run: lockf -k "$HOME/Library/Caches/runner-mac-mini-session.lock" python3 scripts/with-test-keychain.py make -j2 test SWIFT_TEST_FLAGS=--skip-build
      - name: Upload snapshot failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fritz-ui-snapshot-failures
          path: dist/snapshot-failures
          if-no-files-found: ignore
      - name: Build both browser editions
        run: |
          make build
          webkit_app=$(cat dist/.last-built-app)
          test ! -e "$webkit_app/Contents/Frameworks/Chromium Embedded Framework.framework"
          make build BROWSER_ENGINE=chromium
          chromium_app=$(cat dist/.last-built-app)
          test -d "$chromium_app/Contents/Frameworks/Chromium Embedded Framework.framework"

  # Preserve the original required-check name and propagate failure/cancellation.
  complete:
    name: Libraries, app, and runtime
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.user.login == 'gabriel')
    needs: [macos, catalog]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          MACOS_RESULT: ${{ needs.macos.result }}
          CATALOG_RESULT: ${{ needs.catalog.result }}
        run: test "$MACOS_RESULT" = success && test "$CATALOG_RESULT" = success
