name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift tests and macOS build
    runs-on: [self-hosted, macOS, ARM64, rel-ci]
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode-26.6.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5

      - name: Verify Swift toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run Swift tests
        run: swift test --package-path app

      - name: Build native macOS target
        run: swift build --package-path app -c release
