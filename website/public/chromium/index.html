<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fritz Chromium — Experimental edition</title>
  <meta name="description" content="Download the experimental Fritz Chromium edition for model workflows that need a full desktop Chromium browser alongside chat.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F3EFE7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121011" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://fritz.rel.me/chromium/">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/site.mjs"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="nav">
    <div class="nav-inner">
      <a class="wordmark" href="/" aria-label="Fritz home">
        <span class="raven raven--mark" aria-hidden="true"></span>
        <span>fritz</span>
      </a>
    </div>
  </header>

  <main id="main">
    <section class="hero wire" aria-labelledby="hero-title">
      <div class="hero-inner">
        <div class="hero-copy">
          <div class="download-edition">
            <p class="meta">Experimental edition</p>
            <h1 id="hero-title">Fritz Chromium</h1>
          </div>
          <p class="hero-lede">For model workflows that need a full desktop Chromium browser alongside chat.</p>
          <div class="download-edition">
            <a class="button" data-chromium-download hidden>
              <svg class="button-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m0 0-3.5-3.5M10 12l3.5-3.5M4 14.5v1A1.5 1.5 0 0 0 5.5 17h9a1.5 1.5 0 0 0 1.5-1.5v-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Download for Apple silicon
            </a>
            <p class="meta" data-chromium-version>Requires macOS 15 or later on Apple silicon.</p>
            <a class="edition-link" href="https://github.com/rel-me/fritz#build-and-run">Build from source</a>
          </div>
        </div>
        <div class="perch" aria-hidden="true">
          <div class="raven raven--hero"></div>
        </div>
      </div>
    </section>
  </main>
